version: 2

sources:
  - name: raw
    description: Raw API snapshots loaded hourly by Airflow (one row per collected file).
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: raw
    config:
      loaded_at_field: collected_at
      freshness:
        warn_after: {count: 3, period: hour}
        error_after: {count: 12, period: hour}

    tables:
      - name: velib_station_status
        description: Vélib' station availability (GBFS), every 5 minutes.
      - name: youbike_availability
        description: YouBike Hsinchu availability (TDX), every 20 minutes.
      - name: velib_station_information
        description: Vélib' station list (GBFS), daily.
        config:
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
      - name: youbike_station
        description: YouBike Hsinchu station list (TDX), daily.
        config:
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
