# Local customizations, merged automatically by "docker compose" with docker-compose.yaml.
# Tasks run on the worker: it is the only container that needs GCP access.
services:
  airflow-worker:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/adc.json
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID:?set GCP_PROJECT_ID in orchestration/.env}
      GCS_BUCKET: ${GCS_BUCKET:?set GCS_BUCKET in orchestration/.env}
    volumes:
      # Your gcloud ADC credentials, read-only, never copied into an image
      - ${HOME}/.config/gcloud/application_default_credentials.json:/opt/airflow/gcp/adc.json:ro
