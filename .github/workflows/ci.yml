name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a running check when a newer commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: CI only checks the code, it never changes anything
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false   # downloads providers, no state needed
      - run: terraform validate

  python:
    name: Python (ruff + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.6   # same version as local: same rules, same results
      - run: ruff check ingestion orchestration/dags
      - run: python -m py_compile ingestion/*.py orchestration/dags/*.py

  dbt:
    name: dbt (parse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      GCP_PROJECT_ID: ci-placeholder   # parse needs the variable, not a real project
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - run: pip install -r requirements.txt
      - run: dbt parse